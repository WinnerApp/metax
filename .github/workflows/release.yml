name: Release

on:
  push:
    tags:
      - "v*" # 触发条件：当推送的标签以 'v' 开头时

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 只支持 macos【intel/arm64】 和 windows
        os: [macos-latest, windows-latest]
        architecture: [x64]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: dart pub get

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        run: dart compile exe bin/metax.dart -o metax

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: dart compile exe bin/metax.dart -o metax.exe # Windows 带 exe 后缀

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: metax-macos-x64
          path: metax

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: metax-windows-x64
          path: metax.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload MacOS Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/metax-macos-x64/metax
          asset_name: metax-macos-x64
          asset_content_type: application/octet-stream

      - name: Upload Windows Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/metax-windows-x64/metax.exe
          asset_name: metax-windows-x64.exe
          asset_content_type: application/octet-stream
